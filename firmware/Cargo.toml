[package]
name = "bitchat-canary-firmware"
version = "0.1.0"
edition = "2021"
description = "ESP32 canary node firmware stubs for bitchat mesh — harm reduction infrastructure"
license = "Unlicense AND Apache-2.0"
# Dual-licensed to honor both repositories:
#   bitchat: Unlicense (public domain)
#   SecuraCV: Apache-2.0

[features]
default = []
# Enable post-quantum cryptography (Dilithium2 signatures, ML-KEM-768 vault).
# Mirrors SecuraCV's pqc-signatures feature flag.
pqc-signatures = []
# Enable camera support (ESP32-S3 only).
camera = []
# Enable environmental sensor support.
sensors = []

# In production, these would be actual ESP32 dependencies:
# [dependencies]
# esp-idf-hal = "0.44"
# esp-idf-svc = "0.49"
# embedded-hal = "1.0"
# ed25519-dalek = "2"
# sha2 = "0.10"
# chacha20poly1305 = "0.10"
# snow = "0.9"        # Noise protocol
# postcard = "1.0"    # Compact serialization
# heapless = "0.8"    # No-alloc collections

[[bin]]
name = "canary-mesh"
path = "projects/canary_mesh/main.rs"
